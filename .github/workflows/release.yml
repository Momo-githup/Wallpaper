name: Release Wallpaper Studio

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      VELOPACK_VERSION: 1.2.161
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "标签必须是 SemVer，例如 v1.0.0。"
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        run: dotnet restore WallpaperStudio.sln --configfile NuGet.Config --locked-mode

      - name: Test
        run: dotnet test tests/WallpaperStudio.Tests/WallpaperStudio.Tests.csproj -c Release --no-restore

      - name: Publish win-x64
        shell: pwsh
        run: |
          $output = [System.IO.Path]::GetFullPath("publish/win-x64")
          dotnet publish src/WallpaperStudio.App/WallpaperStudio.App.csproj `
            -c Release -r win-x64 --self-contained true --no-restore `
            -p:Version=${{ steps.version.outputs.value }} `
            -p:DebugType=None -p:DebugSymbols=false `
            -o $output
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish 失败。" }

          foreach ($architecture in @("win-x86", "win-arm64")) {
            $target = [System.IO.Path]::GetFullPath((Join-Path $output "libvlc/$architecture"))
            if (-not $target.StartsWith($output + [System.IO.Path]::DirectorySeparatorChar,
                [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "发布清理目录越界：$target"
            }
            if (Test-Path -LiteralPath $target) {
              Remove-Item -LiteralPath $target -Recurse -Force
            }
          }
          Get-ChildItem -LiteralPath $output -Filter *.pdb -File -Recurse |
            Remove-Item -Force

      - name: Setup .NET 10 for Velopack CLI
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version ${{ env.VELOPACK_VERSION }}

      - name: Build Velopack setup payload
        shell: pwsh
        run: |
          vpk pack `
            --packId WallpaperStudio.Desktop `
            --packVersion ${{ steps.version.outputs.value }} `
            --packDir publish/win-x64 `
            --mainExe WallpaperStudio.App.exe `
            --packTitle "Wallpaper Studio" `
            --packAuthors "Momo-githup" `
            --icon src/WallpaperStudio.App/Assets/WallpaperStudio.ico `
            --releaseNotes release-notes.md `
            --shortcuts Desktop,StartMenuRoot `
            --channel win `
            --outputDir Releases `
            --noPortable
          if ($LASTEXITCODE -ne 0) { throw "Velopack 打包失败。" }

      - name: Build graphical custom-path installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem -LiteralPath Releases -Filter "*Setup.exe" -File |
            Select-Object -First 1
          if (-not $setup) { throw "没有找到 Velopack Setup.exe。" }

          $installerOutput = [System.IO.Path]::GetFullPath("publish/installer")
          dotnet publish tools/WallpaperStudio.Installer/WallpaperStudio.Installer.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -p:Version=${{ steps.version.outputs.value }} `
            -p:InstallerPayload="$($setup.FullName)" `
            -p:RequireInstallerPayload=true `
            -o $installerOutput
          if ($LASTEXITCODE -ne 0) { throw "图形化安装程序构建失败。" }

          Copy-Item -LiteralPath (Join-Path $installerOutput "WallpaperStudio-Installer.exe") `
            -Destination "Releases/WallpaperStudio-Installer-win-x64.exe" -Force

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "Releases/WallpaperStudio-Installer-win-x64.exe" `
            --repo "${{ github.repository }}" `
            --title "Wallpaper Studio ${{ steps.version.outputs.value }}" `
            --notes-file release-notes.md `
            --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release 上传失败。" }
